name: site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/web/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # Static demo: the web app with a bundled seed instead of a server,
      # served under /reader/demo/ on the same Pages site.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reader/web exec vite build --base=/reader/demo/ --outDir ../../site/public/demo --emptyOutDir
        env:
          VITE_DEMO: "1"
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
