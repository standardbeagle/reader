<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function(){var t=localStorage.getItem("reader-theme");if(!t){t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";}document.documentElement.dataset.theme=t;})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
